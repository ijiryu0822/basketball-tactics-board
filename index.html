<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>バスケットボール作戦板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #f8fafc;
    }
    #app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* 左右のツールサイドバー */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.95);
      z-index: 20;
      flex-shrink: 0;
    }
    #sidebar-left {
      width: 62px;
      border-right: 1px solid #334155;
    }
    #sidebar-right {
      width: 62px;
      border-left: 1px solid #334155;
    }

    .tool-btn {
      width: 52px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #475569;
      background: #1e293b;
      color: #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.1;
      transition: all 0.15s ease;
    }
    .tool-btn span.icon {
      font-size: 14px;
      margin-bottom: 2px;
    }
    .tool-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
    }
    .tool-btn.danger {
      border-color: #ef4444;
      color: #f87171;
    }
    .tool-btn.danger:active {
      background: #dc2626;
      color: #fff;
    }

    /* ペン設定用 */
    .color-picker-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #475569;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot.active {
      transform: scale(1.15);
      border-color: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .line-type-btn {
      width: 52px;
      height: 32px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid #475569;
      background: #1e293b;
      color: #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .line-type-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #93c5fd;
    }

    /* コート表示エリア */
    #court-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0b1120;
      overflow: hidden;
    }
    #court-stage {
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      border: 2px solid #000000;
      background-color: #fff099; /* 指定の薄黄色 */
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bg-canvas { z-index: 1; }
    #draw-canvas { z-index: 2; pointer-events: none; }
    #piece-canvas { z-index: 3; pointer-events: auto; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 左サイドバー（基本操作） -->
  <div id="sidebar-left" class="sidebar">
    <button id="btn-mode-move" class="tool-btn active" onclick="setMode('move')">
      <span class="icon">👆</span>移動
    </button>
    <button id="btn-mode-draw" class="tool-btn" onclick="setMode('draw')">
      <span class="icon">✏️</span>描く
    </button>
    <button id="btn-mode-erase" class="tool-btn" onclick="setMode('erase')">
      <span class="icon">🧽</span>消す
    </button>
    <div style="height: 1px; width: 44px; background: #334155; margin: 2px 0;"></div>
    <button class="tool-btn" onclick="undoDraw()">
      <span class="icon">↩️</span>戻す
    </button>
    <button class="tool-btn danger" onclick="clearDraw()">
      <span class="icon">🗑️</span>線消去
    </button>
    <button class="tool-btn" onclick="resetPieces()">
      <span class="icon">🔄</span>初期位置
    </button>
  </div>

  <!-- 中央（コート） -->
  <div id="court-wrapper">
    <div id="court-stage">
      <canvas id="bg-canvas"></canvas>
      <canvas id="draw-canvas"></canvas>
      <canvas id="piece-canvas"></canvas>
    </div>
  </div>

  <!-- 右サイドバー（ペンスタイル） -->
  <div id="sidebar-right" class="sidebar">
    <!-- 色 -->
    <div class="color-picker-group">
      <div class="color-dot active" style="background:#ef4444;" onclick="setPenColor('#ef4444', this)"></div>
      <div class="color-dot" style="background:#3b82f6;" onclick="setPenColor('#3b82f6', this)"></div>
      <div class="color-dot" style="background:#22c55e;" onclick="setPenColor('#22c55e', this)"></div>
      <div class="color-dot" style="background:#ffffff;" onclick="setPenColor('#ffffff', this)"></div>
      <div class="color-dot" style="background:#0f172a;" onclick="setPenColor('#0f172a', this)"></div>
    </div>
    <div style="height: 1px; width: 44px; background: #334155; margin: 2px 0;"></div>
    <!-- 線の種類 -->
    <button id="btn-line-arrow-solid" class="line-type-btn active" onclick="setLineType('arrow-solid')">➜ 実線</button>
    <button id="btn-line-arrow-dash" class="line-type-btn" onclick="setLineType('arrow-dash')">➜ 点線</button>
    <button id="btn-line-solid" class="line-type-btn" onclick="setLineType('solid')">― 実線</button>
    <button id="btn-line-dash" class="line-type-btn" onclick="setLineType('dash')">⋯ 点線</button>
  </div>
</div>

<script>
  // コート設定 (FIBA規格比率 28m x 15m)
  const COURT_RATIO = 28 / 15;
  let stageW = 0;
  let stageH = 0;

  const courtStage = document.getElementById('court-stage');
  const courtWrapper = document.getElementById('court-wrapper');
  const bgCanvas = document.getElementById('bg-canvas');
  const drawCanvas = document.getElementById('draw-canvas');
  const pieceCanvas = document.getElementById('piece-canvas');

  const bgCtx = bgCanvas.getContext('2d');
  const drawCtx = drawCanvas.getContext('2d');
  const pieceCtx = pieceCanvas.getContext('2d');

  // モード・描画状態
  let currentMode = 'move'; // 'move', 'draw', 'erase'
  let penColor = '#ef4444';
  let lineType = 'arrow-solid'; // 'arrow-solid', 'arrow-dash', 'solid', 'dash'
  let drawings = [];
  let currentStroke = null;

  // 初期配置定義（割合 0.0〜1.0）
  const defaultPositions = [
    // 赤チーム
    { id: 'r1', team: 'red', num: '1', x: 0.58, y: 0.63 },
    { id: 'r2', team: 'red', num: '2', x: 0.44, y: 0.48 },
    { id: 'r3', team: 'red', num: '3', x: 0.45, y: 0.72 },
    { id: 'r4', team: 'red', num: '4', x: 0.32, y: 0.83 },
    { id: 'r5', team: 'red', num: '5', x: 0.35, y: 0.67 },
    // 青チーム
    { id: 'b1', team: 'blue', num: '1', x: 0.64, y: 0.64 },
    { id: 'b2', team: 'blue', num: '2', x: 0.50, y: 0.39 },
    { id: 'b3', team: 'blue', num: '3', x: 0.56, y: 0.84 },
    { id: 'b4', team: 'blue', num: '4', x: 0.29, y: 0.90 },
    { id: 'b5', team: 'blue', num: '5', x: 0.34, y: 0.75 },
    // ボール
    { id: 'ball', team: 'ball', num: '', x: 0.62, y: 0.59 }
  ];

  let pieces = JSON.parse(JSON.stringify(defaultPositions));
  let draggingPiece = null;
  let selectedPiece = null;
  let dragOffset = { x: 0, y: 0 };
  let lastTapTime = 0;
  let lastTapTarget = null;
  let remoteDragStart = null;

  // 画面リサイズとフィット計算
  function resizeStage() {
    const wrapW = courtWrapper.clientWidth;
    const wrapH = courtWrapper.clientHeight;
    if (wrapW <= 0 || wrapH <= 0) return;

    let targetW = wrapW;
    let targetH = targetW / COURT_RATIO;

    if (targetH > wrapH) {
      targetH = wrapH;
      targetW = targetH * COURT_RATIO;
    }

    stageW = Math.floor(targetW);
    stageH = Math.floor(targetH);

    courtStage.style.width = stageW + 'px';
    courtStage.style.height = stageH + 'px';

    const dpr = window.devicePixelRatio || 1;
    [bgCanvas, drawCanvas, pieceCanvas].forEach(cnv => {
      cnv.width = stageW * dpr;
      cnv.height = stageH * dpr;
      cnv.style.width = stageW + 'px';
      cnv.style.height = stageH + 'px';
    });

    bgCtx.scale(dpr, dpr);
    drawCtx.scale(dpr, dpr);
    pieceCtx.scale(dpr, dpr);

    drawCourt();
    redrawDrawings();
    drawPieces();
  }

  // コート描画（床：薄黄色、線：黒）
  function drawCourt() {
    bgCtx.clearRect(0, 0, stageW, stageH);
    bgCtx.fillStyle = '#fff099';
    bgCtx.fillRect(0, 0, stageW, stageH);

    bgCtx.strokeStyle = '#000000';
    bgCtx.lineWidth = Math.max(2, stageW * 0.0035);
    bgCtx.lineCap = 'round';
    bgCtx.lineJoin = 'round';

    const w = stageW;
    const h = stageH;

    // 外枠 & センターライン
    bgCtx.strokeRect(0, 0, w, h);
    bgCtx.beginPath();
    bgCtx.moveTo(w / 2, 0);
    bgCtx.lineTo(w / 2, h);
    bgCtx.stroke();

    // センターサークル
    const centerR = h * 0.125;
    bgCtx.beginPath();
    bgCtx.arc(w / 2, h / 2, centerR, 0, Math.PI * 2);
    bgCtx.stroke();

    // 制限区域 & 3Pライン描画
    drawCourtSide(0, 1);
    drawCourtSide(w, -1);
  }

  function drawCourtSide(baseX, dir) {
    const w = stageW;
    const h = stageH;
    const keyW = w * 0.20;
    const keyH = h * 0.33;
    const keyTop = (h - keyH) / 2;

    // ペイントエリア
    bgCtx.fillStyle = '#fde047';
    bgCtx.fillRect(dir === 1 ? 0 : w - keyW, keyTop, keyW, keyH);
    bgCtx.strokeRect(dir === 1 ? 0 : w - keyW, keyTop, keyW, keyH);

    // フリースローサークル
    const ftCenterX = baseX + dir * keyW;
    const ftCenterY = h / 2;
    const ftRadius = h * 0.125;

    bgCtx.beginPath();
    bgCtx.arc(ftCenterX, ftCenterY, ftRadius, -Math.PI / 2, Math.PI / 2, dir === 1 ? false : true);
    bgCtx.stroke();

    // バックボード & ゴール
    const backboardX = baseX + dir * (w * 0.04);
    const ringX = baseX + dir * (w * 0.055);
    bgCtx.lineWidth = Math.max(3, w * 0.005);
    bgCtx.beginPath();
    bgCtx.moveTo(backboardX, h / 2 - h * 0.06);
    bgCtx.lineTo(backboardX, h / 2 + h * 0.06);
    bgCtx.stroke();

    bgCtx.lineWidth = Math.max(2, w * 0.003);
    bgCtx.strokeStyle = '#ea580c';
    bgCtx.beginPath();
    bgCtx.arc(ringX, h / 2, h * 0.022, 0, Math.PI * 2);
    bgCtx.stroke();
    bgCtx.strokeStyle = '#000000';

    // 3Pライン
    const threeRadius = w * 0.24;
    const cornerY = h * 0.09;
    const cornerStraightX = baseX + dir * Math.sqrt(Math.max(0, Math.pow(threeRadius, 2) - Math.pow(h / 2 - cornerY, 2)));

    bgCtx.beginPath();
    bgCtx.moveTo(baseX, cornerY);
    bgCtx.lineTo(cornerStraightX, cornerY);

    const startAngle = dir === 1 ? -Math.asin((h / 2 - cornerY) / threeRadius) : Math.PI + Math.asin((h / 2 - cornerY) / threeRadius);
    const endAngle = dir === 1 ? Math.asin((h / 2 - cornerY) / threeRadius) : Math.PI - Math.asin((h / 2 - cornerY) / threeRadius);

    bgCtx.arc(ringX, h / 2, threeRadius, startAngle, endAngle, dir === -1);
    bgCtx.lineTo(baseX, h - cornerY);
    bgCtx.stroke();
  }

  // 駒描画（従来の70%サイズに調整）
  function drawPieces() {
    pieceCtx.clearRect(0, 0, stageW, stageH);

    // 70%サイズ (以前の 0.028 -> 0.020)
    const playerRadius = Math.max(12, stageH * 0.038);
    const ballRadius = playerRadius * 0.72;

    pieces.forEach(p => {
      const px = p.x * stageW;
      const py = p.y * stageH;
      const isSelected = selectedPiece && selectedPiece.id === p.id;
      const isDragging = draggingPiece && draggingPiece.id === p.id;

      let drawY = py;
      // ドラッグ中は指で隠れないよう上方に浮かせる
      if (isDragging && !remoteDragStart) {
        drawY -= 55;
      }

      pieceCtx.save();

      // 影
      pieceCtx.shadowColor = 'rgba(0,0,0,0.35)';
      pieceCtx.shadowBlur = (isSelected || isDragging) ? 14 : 5;
      pieceCtx.shadowOffsetY = (isSelected || isDragging) ? 8 : 2;

      if (p.team === 'ball') {
        pieceCtx.beginPath();
        pieceCtx.arc(px, drawY, ballRadius, 0, Math.PI * 2);
        pieceCtx.fillStyle = '#ea580c';
        pieceCtx.fill();
        pieceCtx.strokeStyle = '#7c2d12';
        pieceCtx.lineWidth = 1.5;
        pieceCtx.stroke();
      } else {
        pieceCtx.beginPath();
        pieceCtx.arc(px, drawY, playerRadius, 0, Math.PI * 2);
        pieceCtx.fillStyle = p.team === 'red' ? '#ef4444' : '#2563eb';
        pieceCtx.fill();
        pieceCtx.strokeStyle = '#ffffff';
        pieceCtx.lineWidth = 2;
        pieceCtx.stroke();

        // 選択中ハイライトリング
        if (isSelected) {
          pieceCtx.beginPath();
          pieceCtx.arc(px, drawY, playerRadius + 5, 0, Math.PI * 2);
          pieceCtx.strokeStyle = '#facc15';
          pieceCtx.lineWidth = 3;
          pieceCtx.stroke();
        }

        // 背番号
        pieceCtx.shadowColor = 'transparent';
        pieceCtx.fillStyle = '#ffffff';
        pieceCtx.font = `bold ${Math.round(playerRadius * 1.15)}px sans-serif`;
        pieceCtx.textAlign = 'center';
        pieceCtx.textBaseline = 'middle';
        pieceCtx.fillText(p.num, px, drawY);
      }

      pieceCtx.restore();
    });
  }

  // 矢印・線の再描画
  function redrawDrawings() {
    drawCtx.clearRect(0, 0, stageW, stageH);
    drawings.forEach(d => renderStroke(drawCtx, d));
  }

  function renderStroke(ctx, stroke) {
    if (!stroke.points || stroke.points.length < 2) return;

    ctx.save();
    ctx.strokeStyle = stroke.color;
    ctx.fillStyle = stroke.color;
    ctx.lineWidth = Math.max(3, stageW * 0.005);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (stroke.type.includes('dash')) {
      ctx.setLineDash([8, 6]);
    } else {
      ctx.setLineDash([]);
    }

    ctx.beginPath();
    ctx.moveTo(stroke.points[0].x * stageW, stroke.points[0].y * stageH);
    for (let i = 1; i < stroke.points.length; i++) {
      ctx.lineTo(stroke.points[i].x * stageW, stroke.points[i].y * stageH);
    }
    ctx.stroke();

    // 矢印の鏃
    if (stroke.type.startsWith('arrow')) {
      const pEnd = stroke.points[stroke.points.length - 1];
      const pPrev = stroke.points[Math.max(0, stroke.points.length - 4)];
      const endX = pEnd.x * stageW;
      const endY = pEnd.y * stageH;
      const prevX = pPrev.x * stageW;
      const prevY = pPrev.y * stageH;

      const angle = Math.atan2(endY - prevY, endX - prevX);
      const headlen = Math.max(12, stageW * 0.016);

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // タッチ & マウスイベント処理
  function getStageCoords(e) {
    const rect = courtStage.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) / stageW,
      y: (clientY - rect.top) / stageH
    };
  }

  function findPieceAt(coords) {
    const playerRadius = Math.max(14, stageH * 0.04) / stageW;
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      const dist = Math.hypot(p.x - coords.x, (p.y - coords.y) * (stageH / stageW));
      if (dist < playerRadius * 1.5) {
        return p;
      }
    }
    return null;
  }

  pieceCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const coords = getStageCoords(e);
    const now = Date.now();

    if (currentMode === 'move') {
      const hitPiece = findPieceAt(coords);

      // ダブルタップ検知（選択状態トグル）
      if (now - lastTapTime < 320) {
        if (hitPiece) {
          selectedPiece = hitPiece;
        } else {
          selectedPiece = null;
        }
        drawPieces();
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;

      // 遠隔ドラッグ（駒選択中のトラックパッド風スライド）
      if (selectedPiece && !hitPiece) {
        remoteDragStart = { startX: coords.x, startY: coords.y, pieceInitX: selectedPiece.x, pieceInitY: selectedPiece.y };
        draggingPiece = selectedPiece;
        return;
      }

      // 通常ドラッグ
      if (hitPiece) {
        draggingPiece = hitPiece;
        remoteDragStart = null;
        dragOffset.x = coords.x - hitPiece.x;
        dragOffset.y = coords.y - hitPiece.y;
        drawPieces();
      }
    } else if (currentMode === 'draw') {
      currentStroke = {
        color: penColor,
        type: lineType,
        points: [coords]
      };
    } else if (currentMode === 'erase') {
      eraseStrokeAt(coords);
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!draggingPiece && !currentStroke) return;
    const coords = getStageCoords(e);

    if (currentMode === 'move' && draggingPiece) {
      if (remoteDragStart) {
        const dx = coords.x - remoteDragStart.startX;
        const dy = coords.y - remoteDragStart.startY;
        draggingPiece.x = Math.max(0.02, Math.min(0.98, remoteDragStart.pieceInitX + dx));
        draggingPiece.y = Math.max(0.02, Math.min(0.98, remoteDragStart.pieceInitY + dy));
      } else {
        draggingPiece.x = Math.max(0.02, Math.min(0.98, coords.x - dragOffset.x));
        draggingPiece.y = Math.max(0.02, Math.min(0.98, coords.y - dragOffset.y));
      }
      drawPieces();
    } else if (currentMode === 'draw' && currentStroke) {
      currentStroke.points.push(coords);
      redrawDrawings();
      renderStroke(drawCtx, currentStroke);
    } else if (currentMode === 'erase') {
      eraseStrokeAt(coords);
    }
  });

  window.addEventListener('pointerup', () => {
    if (draggingPiece) {
      draggingPiece = null;
      remoteDragStart = null;
      drawPieces();
    }
    if (currentStroke) {
      if (currentStroke.points.length > 2) {
        drawings.push(currentStroke);
      }
      currentStroke = null;
      redrawDrawings();
    }
  });

  // 個別消しゴム判定
  function eraseStrokeAt(coords) {
    const threshold = 0.035;
    const initialLen = drawings.length;
    drawings = drawings.filter(stroke => {
      return !stroke.points.some(p => Math.hypot(p.x - coords.x, (p.y - coords.y) * (stageH / stageW)) < threshold);
    });
    if (drawings.length !== initialLen) {
      redrawDrawings();
    }
  }

  // ツールバー操作
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('#sidebar-left .tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-mode-${mode}`).classList.add('active');
    if (mode !== 'move') {
      selectedPiece = null;
      drawPieces();
    }
  }

  function setPenColor(color, el) {
    penColor = color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    setMode('draw');
  }

  function setLineType(type) {
    lineType = type;
    document.querySelectorAll('.line-type-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-line-${type}`).classList.add('active');
    setMode('draw');
  }

  function undoDraw() {
    drawings.pop();
    redrawDrawings();
  }

  function clearDraw() {
    if (drawings.length === 0) return;
    drawings = [];
    redrawDrawings();
  }

  function resetPieces() {
    pieces = JSON.parse(JSON.stringify(defaultPositions));
    selectedPiece = null;
    draggingPiece = null;
    drawPieces();
  }

  // 自動リサイズ監視
  window.addEventListener('resize', resizeStage);
  window.addEventListener('orientationchange', () => {
    setTimeout(resizeStage, 100);
    setTimeout(resizeStage, 500);
  });
  window.addEventListener('load', () => {
    resizeStage();
    setTimeout(resizeStage, 150);
    setTimeout(resizeStage, 600);
  });
</script>
</body>
</html>
